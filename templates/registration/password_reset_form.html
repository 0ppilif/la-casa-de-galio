{% extends 'tienda/base.html' %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6 mt-4">
        <div class="card shadow border-primary">
            <div class="card-header bg-primary text-white text-center">
                <h4>Recuperar Contraseña</h4>
            </div>
            <div class="card-body">
                <p>Ingresa tu correo para recibir un enlace seguro de recuperación.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Enviar enlace</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
